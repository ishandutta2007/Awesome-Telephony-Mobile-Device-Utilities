<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1035"/>
    </linearGradient>

    <!-- Accent glow gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3"/>
    </pattern>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-18px) translateX(12px); opacity: 0.7; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes signalWave {
        0% { r: 12px; opacity: 0.8; stroke-width: 2.5px; }
        50% { r: 48px; opacity: 0.4; stroke-width: 1.8px; }
        100% { r: 84px; opacity: 0; stroke-width: 0.5px; }
      }
      @keyframes signalWave2 {
        0% { r: 12px; opacity: 0; }
        25% { opacity: 0.7; }
        100% { r: 96px; opacity: 0; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      .glow-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .glow-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite 3.5s;
        transform-origin: 1000px 320px;
      }
      .signal-1 {
        animation: signalWave 3.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
      }
      .signal-2 {
        animation: signalWave2 3.2s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 1.2s;
      }
      .data-line {
        stroke-dasharray: 6, 6;
        animation: dashFlow 2s linear infinite;
      }
      .p1 { animation: floatParticle 6s ease-in-out infinite; }
      .p2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
      .p3 { animation: floatParticle 7s ease-in-out infinite 3s; }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>
  <rect width="1200" height="420" rx="16" fill="url(#grid)"/>

  <!-- Ambient dynamic blur orbs in the background (will not cover text) -->
  <circle class="glow-orb-1" cx="180" cy="90" r="140" fill="#38bdf8" filter="blur(65px)"/>
  <circle class="glow-orb-2" cx="1020" cy="310" r="160" fill="#a855f7" filter="blur(75px)"/>
  <circle cx="950" cy="110" r="110" fill="#6366f1" filter="blur(60px)" opacity="0.3"/>

  <!-- Dynamic Animated Signal Waves (Right Side Graphic) -->
  <g transform="translate(1010, 190)" opacity="0.9">
    <!-- Concentric radar/signal waves -->
    <circle class="signal-1" cx="0" cy="0" r="20" fill="none" stroke="#38bdf8"/>
    <circle class="signal-2" cx="0" cy="0" r="20" fill="none" stroke="#a855f7"/>
    <circle cx="0" cy="0" r="10" fill="#38bdf8" opacity="0.9"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>

  <!-- Connected Telephony & Device Network Architecture Flow in Background -->
  <g opacity="0.4">
    <!-- Connecting flow lines -->
    <path class="data-line" d="M 820 190 L 1010 190" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path class="data-line" d="M 1010 190 L 1120 120" fill="none" stroke="#818cf8" stroke-width="1.5"/>
    <path class="data-line" d="M 1010 190 L 1110 270" fill="none" stroke="#c084fc" stroke-width="1.5"/>
    
    <!-- Satellite Nodes -->
    <circle cx="820" cy="190" r="7" fill="#38bdf8"/>
    <circle cx="1120" cy="120" r="6" fill="#818cf8"/>
    <circle cx="1110" cy="270" r="6" fill="#c084fc"/>
  </g>

  <!-- Floating Network Particles -->
  <circle class="p1" cx="240" cy="330" r="3" fill="#38bdf8"/>
  <circle class="p2" cx="720" cy="70" r="3.5" fill="#c084fc"/>
  <circle class="p3" cx="890" cy="340" r="2.5" fill="#818cf8"/>
  <circle class="p1" cx="540" cy="40" r="2" fill="#38bdf8"/>

  <!-- Top Badge Pill -->
  <g transform="translate(70, 52)">
    <rect width="320" height="34" rx="17" fill="url(#badge-glow)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="18" cy="17" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="34" y="22" fill="#e0f2fe" class="subtitle-text" font-size="13" font-weight="600" letter-spacing="0.5">TELEPHONY &amp; MOBILE UTILITIES</text>
  </g>

  <!-- Foreground Main Title & Brand Content -->
  <!-- Guaranteed high contrast, clean readable typography -->
  <text x="70" y="145" fill="url(#primary-grad)" class="title-text" font-size="44">Awesome Telephony &amp;</text>
  <text x="70" y="195" fill="#ffffff" class="title-text" font-size="44">Mobile Device Utilities 📱⚡</text>

  <!-- Foreground Subtitle & Description -->
  <text x="70" y="240" fill="#94a3b8" class="subtitle-text" font-size="17">
    Curated stack for Cloud Communications (CPaaS), VoIP/SIP Engines,
  </text>
  <text x="70" y="266" fill="#94a3b8" class="subtitle-text" font-size="17">
    WebRTC Bridges, Mobile Screen Mirroring &amp; iOS/Android Device Automation.
  </text>

  <!-- Capability Feature Tags / Technology Badges in Foreground -->
  <g transform="translate(70, 310)">
    <!-- Tag 1: CPaaS & VoIP -->
    <rect x="0" y="0" width="125" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="14" y="21" fill="#38bdf8" class="subtitle-text" font-size="13" font-weight="600">📞 CPaaS &amp; PBX</text>

    <!-- Tag 2: SIP & WebRTC -->
    <rect x="137" y="0" width="138" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="151" y="21" fill="#818cf8" class="subtitle-text" font-size="13" font-weight="600">🌐 SIP &amp; WebRTC</text>

    <!-- Tag 3: Device Control & Scrcpy -->
    <rect x="287" y="0" width="168" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="301" y="21" fill="#a855f7" class="subtitle-text" font-size="13" font-weight="600">📲 Mobile Inspection</text>

    <!-- Tag 4: Voice AI & Gateways -->
    <rect x="467" y="0" width="158" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
    <text x="481" y="21" fill="#34d399" class="subtitle-text" font-size="13" font-weight="600">🤖 Voice AI &amp; SMS</text>
  </g>

  <!-- Foreground subtle bottom border accent -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primary-grad)"/>
</svg>